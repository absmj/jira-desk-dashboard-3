; Jira Sprint Desk Dashboard
;
;   sim        -> built for the Wokwi simulator (ESP32-C3-DevKitM-1 model, ILI9341 display,
;                 simulated MP3 playback on a buzzer, fast simulated clock)
;   supermini  -> built for the physical ESP32-C3 SuperMini
;
; Both environments compile the same source code. Only the flags differ.
;
; JSON files live in internal flash (LittleFS), built from the data/ folder:
;   pio run -e sim -t buildfs      (data/ -> .pio/build/sim/littlefs.bin)
;   pio run -e sim                 (firmware + merge into firmware.merged.bin for Wokwi)
;   pio run -e supermini -t uploadfs   (real board: write the data/ image to flash)

[platformio]
default_envs = sim

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit PCD8544 Nokia 5110 LCD library@^2.0.3
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit ILI9341@^1.6.1
    bblanchon/ArduinoJson@^7.4.2

[env:sim]
; Simulation: ILI9341 stands in for the Nokia 5110 (see src/display/Ili9341Display.h),
; and SimMp3Audio models the DFPlayer's behaviour on top of a buzzer.
board = esp32-c3-devkitm-1
extra_scripts = post:merge_firmware.py
build_flags =
    -DDISPLAY_ILI9341
    -DAUDIO_SIM_MP3
    ; 1 real second = 1 simulated minute, so time-based alert rules can be tested quickly.
    ; Use 1 for real time.
    -DDEV_CLOCK_SPEED=60

[env:supermini]
; The SuperMini has no dedicated PlatformIO board definition that is
; guaranteed to match. The devkitm-1 definition works because the chip and
; flash layout are the same. USB is native, so Serial goes over USB CDC.
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBLE_RECEIVER
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.5.1
