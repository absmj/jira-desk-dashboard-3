; Jira Sprint Desk Dashboard - Phase 1
;
;   sim        -> built for the Wokwi simulator (ESP32-C3-DevKitM-1 model)
;   supermini  -> built for the physical ESP32-C3 SuperMini
;
; Both environments compile the same source code. Only the board flags differ.

[platformio]
default_envs = sim

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit PCD8544 Nokia 5110 LCD library@^2.0.3
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit ILI9341@^1.6.1
    bblanchon/ArduinoJson@^7.4.2

[env:sim]
; Simulation uses an ILI9341 stand-in (see src/display/Ili9341Display.h).
; The physical device uses the Nokia 5110 (supermini environment).
board = esp32-c3-devkitm-1
build_flags =
    -DDISPLAY_ILI9341

[env:supermini]
; The SuperMini has no dedicated PlatformIO board definition that is
; guaranteed to match. The devkitm-1 definition works because the chip and
; flash layout are the same. USB is native, so Serial goes over USB CDC.
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
